plugins {
    id 'java'
    id 'application'
    id 'info.solidsoft.pitest' version '1.15.0'
}

group = 'com.Nunes.aqua_and_iginis'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

application {
    mainClass.set("com.Nunes.aqua_and_ignis.Application")
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    testImplementation 'org.mockito:mockito-core:5.+'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.+'

    implementation group: 'com.googlecode.lanterna', name: 'lanterna', version: '3.1.1'
}

test {
    useJUnitPlatform()
}

tasks.register('buildFont', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.Nunes.aqua_and_ignis.tools.TileFontBuilder'
    args 'src/main/resources/sprites/sprites.txt', 'src/main/resources/fonts/AquaIgnisTiles.ttf'
}

pitest {
    targetClasses = ['com.Nunes.aqua_and_ignis.*']
    targetTests = ['com.Nunes.aqua_and_ignis.*']
    junit5PluginVersion = '1.2.1'
    threads = 4
    outputFormats = ['HTML']
    timestampedReports = false
}